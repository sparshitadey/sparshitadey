name: Generate Neutrino Oscillation SVG

on:
  schedule:
    - cron: "30 0 * * *"  # daily at 00:30 UTC
  workflow_dispatch:         # allows manual trigger from Actions tab
  push:
    branches:
      - main
    paths:
      - "scripts/generate_oscillation.py"   # also re-runs if one edits the script

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run oscillation generator
        run: python scripts/generate_oscillation.py

      - name: Commit and push SVG
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/neutrino_oscillation.svg
          git diff --cached --quiet || git commit -m "chore: regenerate neutrino oscillation SVG"
          git push
